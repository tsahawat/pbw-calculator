name: CountAPI Daily Log
permissions:
  contents: write

on:
  schedule:
    - cron: "5 0 * * *"   # 00:05 UTC (~07:05 Bangkok)
  workflow_dispatch:

jobs:
  log:
    runs-on: ubuntu-latest
    env:
      NS: pbw-calculator
      PROXY: https://pbw-calc.sahawatt.workers.dev/   # <-- your Worker URL
    steps:
      - uses: actions/checkout@v4

      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

      - name: Initialize keys (idempotent)
        run: |
          curl -s "$PROXY/create/$NS/visits" || true
          curl -s "$PROXY/create/$NS/calc"   || true

      - name: Fetch counts via proxy
        id: get
        run: |
          set -e
          VISITS=$(curl -s "$PROXY/get/$NS/visits" | jq -r '.value // empty')
          CALC=$(curl -s "$PROXY/get/$NS/calc"   | jq -r '.value // empty')
          echo "ts=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "visits=$VISITS" >> $GITHUB_OUTPUT
          echo "calc=$CALC" >> $GITHUB_OUTPUT

      - name: Append to analytics/countapi_log.csv
        run: |
          mkdir -p analytics
          FILE=analytics/countapi_log.csv
          if [ ! -f "$FILE" ]; then echo "timestamp,visits,calc" > "$FILE"; fi
          echo "${{ steps.get.outputs.ts }},${{ steps.get.outputs.visits }},${{ steps.get.outputs.calc }}" >> "$FILE"

      - name: Commit CSV update
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add analytics/countapi_log.csv
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update CountAPI log"
            git push
          fi
